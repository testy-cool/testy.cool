<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Stream - testy.cool</title>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="page-grid" aria-hidden="true"></div>
    <main class="shell">
      <header class="site-header">
        <a class="wordmark" href="/" aria-label="Stream home">
          <span class="wordmark-mark" aria-hidden="true">t.</span>
          <span>stream</span>
        </a>
        <div class="privacy-chip">
          <span class="privacy-dot" aria-hidden="true"></span>
          Private
        </div>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Personal field notes</p>
        <h1 id="page-title">Keep the thought.<br /><span>Sort it out later.</span></h1>
      </section>

      <section class="composer-panel" aria-label="New thought">
        <form id="composer-form">
          <label class="sr-only" for="composer-body">Write a thought</label>
          <textarea
            id="composer-body"
            name="body"
            maxlength="10000"
            rows="4"
            placeholder="Write it down before it disappears."
            required
          ></textarea>

          <div class="composer-meta">
            <label class="tag-field" for="composer-tags">
              <span>#</span>
              <input
                id="composer-tags"
                name="tags"
                type="text"
                autocomplete="off"
                placeholder="tags, separated, by commas"
              />
            </label>

            <fieldset class="status-switch">
              <legend class="sr-only">Entry type</legend>
              <label>
                <input type="radio" name="status" value="thought" checked />
                <span>Thought</span>
              </label>
              <label>
                <input type="radio" name="status" value="idea" />
                <span>Idea</span>
              </label>
            </fieldset>
          </div>

          <div class="composer-footer">
            <span id="character-count" class="character-count">0 / 10,000</span>
            <div class="submit-group">
              <span class="shortcut" aria-hidden="true">⌘ Enter</span>
              <button class="primary-button" type="submit">Post to stream</button>
            </div>
          </div>
        </form>
      </section>

      <section class="feed-section" aria-labelledby="feed-heading">
        <div class="feed-toolbar">
          <div>
            <p class="eyebrow">Archive</p>
            <h2 id="feed-heading">Your stream</h2>
          </div>
          <label class="search-field" for="search-input">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
            <span class="sr-only">Search your stream</span>
            <input id="search-input" type="search" placeholder="Search" autocomplete="off" />
          </label>
        </div>

        <div id="feed-status" class="feed-status" role="status">Loading your stream…</div>
        <div id="feed" class="feed" aria-live="polite"></div>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
